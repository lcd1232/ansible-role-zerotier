---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "0 5 * * 4"

defaults:
  run:
    working-directory: 'lcd1232.zerotier'

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'lcd1232.zerotier'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install yamllint

      - name: Lint code.
        run: |
          yamllint .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4
        with:
          path: 'lcd1232.zerotier'

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible

      - name: Check Ansible version.
        run: ansible --version

      - name: Create ansible.cfg with correct roles_path.
        run: printf '[defaults]\nroles_path=../' >ansible.cfg

      - name: Test role syntax.
        run: ansible-playbook tests/test.yml -i tests/inventory --syntax-check

      - name: Notify Ansible Galaxy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        continue-on-error: true
        run: |
          curl -X POST https://galaxy.ansible.com/api/v1/notifications/ \
            -H "Content-Type: application/json" \
            -d "{\"github_repository\": \"${{ github.repository }}\", \"github_branch\": \"${{ github.ref_name }}\"}"
